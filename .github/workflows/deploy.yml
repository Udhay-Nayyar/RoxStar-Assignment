name: ROXSTAR Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  # Install dependencies and run the backend test suite first.
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Build the same production image used by the EC2 deployment.
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file server/backend/Dockerfile --tag roxstar-backend:ci server

  # Pull the tested commit on EC2, rebuild, restart, and verify the health endpoint.
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # appleboy/ssh-action handles SSH key setup, host-key handling, and command execution
      # consistently, avoiding fragile hand-written ssh/scp setup in the workflow.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # script_stop: true
          script: |
            set -eu
            cd ~/RoxStar-Assignment/server
            git pull --ff-only origin main
            docker compose up --build -d
            curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:3000/health
